org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Mod
mod_id=elapsed
mod_name=Elapsed
mod_version=1.0.1
mod_author=Romoslayer
mod_description=Offline progression for Minecraft servers: furnaces, crops, brewing stands, campfires, copper and growing animals catch up on the time that passed while their chunks were unloaded, worked out once when they load again instead of being simulated. Joining players do not need the mod.
license=PolyForm-Shield-1.0.0
group=dev.romoslayer.elapsed

# Loaders shared by every supported game version (per-version values are in versions/<mc>.properties)
fabric_loader_version=0.19.5
loom_version=1.17.21
# Minecraft 1.21.x and 1.20.x are obfuscated and need the older "fabric-loom" plugin, which remaps
loom_version_legacy=1.13.6
moddev_version=2.0.148
forgegradle_version=7.0.40
mixinextras_version=0.5.3

# ForgeGradle 7 dev runs: put the Forge module's compiled classes and resources in one place, so Forge sees one mod
# rather than two halves. Does not change the built jar.
net.minecraftforge.gradle.merge-source-sets=true
